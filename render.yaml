services:
  - type: web
    name: nero-labs-bot
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "3001"
      - key: DATABASE_PATH
        value: /app/data/nerolabs.db
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        value: "8283843309:AAECXqKTNz1PdTgsJULDwie8mBrjwZep8Cg"
      - key: TELEGRAM_OWNER_ID
        value: "8685232094"
      - key: SCALEMAX_API_KEY
        sync: false
      - key: SCALEMAX_BASE_URL
        value: "https://api.scalemax.pro/token/v1"
      - key: SCALEMAX_DEFAULT_MODEL
        value: "deepseek-v4-flash"
      - key: DASHBOARD_ACCESS_KEY
        value: "nero_labs_secret_key_2026"
      - key: WHATSAPP_ENABLED
        value: "true"
      - key: WHATSAPP_OWNER_NUMBER
        value: "919317741936"
      - key: WHATSAPP_AUTO_REPLY
        value: "true"
      - key: WHATSAPP_MODE
        value: "all"
      - key: WHATSAPP_NOTIFY_TELEGRAM
        value: "true"
